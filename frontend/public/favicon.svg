<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F1E36"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF5350"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
  </defs>
  <!-- Background Badge (Dark Navy) for high contrast on light & dark browser tabs -->
  <rect width="32" height="32" rx="7" fill="url(#navyGrad)"/>
  
  <!-- Clinical Blood Drop Shape (Medical Red) -->
  <path d="M16 5 C16 5 9.5 13.5 9.5 19 C9.5 22.866 12.41 26 16 26 C19.59 26 22.5 22.866 22.5 19 C22.5 13.5 16 5 16 5 Z" fill="url(#dropGrad)"/>
  
  <!-- Medical Cross Accent (Pure White) -->
  <rect x="14.75" y="15.5" width="2.5" height="7" rx="0.8" fill="#FFFFFF"/>
  <rect x="12.5" y="17.75" width="7" height="2.5" rx="0.8" fill="#FFFFFF"/>
  
  <!-- Specular Reflection Highlight -->
  <ellipse cx="13.2" cy="14" rx="1.2" ry="2.8" transform="rotate(-30 13.2 14)" fill="#FFFFFF" fill-opacity="0.3"/>
</svg>
